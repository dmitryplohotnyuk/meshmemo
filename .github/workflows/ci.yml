name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-and-protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements/constraints.txt -e '.[dev]'
      - run: python scripts/release-check.py
      - run: python scripts/prepare-firmware.py --profile inherited-ua22 --replay
      - name: Compile portable firmware protocol harness
        run: g++ -std=c++17 -Wall -Wextra -Werror -I .build/firmware/src/mesh tests/native/bridge_harness.cpp .build/firmware/src/mesh/UsbSfBridge.cpp -o .build/bridge_harness
      - run: python -m pytest
        env:
          USF_BRIDGE_HARNESS: .build/bridge_harness
      - run: python -m build
      - name: Smoke test the installed wheel outside the source checkout
        shell: bash
        run: |
          python -m pip uninstall -y meshtastic-sf-server
          python -m pip install --no-deps dist/*.whl
          cp scripts/smoke-installed.py "$RUNNER_TEMP/meshmemo-smoke.py"
          cd "$RUNNER_TEMP"
          python meshmemo-smoke.py
          python -m pip check
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements/constraints.txt --no-deps --disable-pip
  browser-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/meshtastic_sf/web/static/app.js
      - run: node --test tests/ui/i18n.test.cjs
