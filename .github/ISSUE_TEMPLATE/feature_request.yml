name: Feature request
description: Propose an improvement to MeshMemo.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user need and relevant constraints.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives or operational impact if known.
    validations:
      required: true
